# Netlify: app Next.js del monorepo (pnpm workspaces). El adaptador de Next.js se instala solo.
[build]
  base = "apps/web"
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Variables NEXT_PUBLIC_SUPABASE_* y SUPABASE_SECRET_KEY se configuran en Netlify (no aquí).
